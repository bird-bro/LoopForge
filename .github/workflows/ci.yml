name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'lib/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'skills/**'
      - 'lib/**'
      - 'tests/**'
      - 'build.sh'
      - '.github/workflows/ci.yml'

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify scaffold.sh files match build output
        run: bash build.sh --check

  test:
    runs-on: ${{ matrix.os }}
    needs: build-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install openspec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Verify bash version
        run: bash --version

      - name: Syntax check (both versions)
        run: |
          bash -n skills/loopforge-cc/scaffold.sh
          bash -n skills/loopforge-codex/scaffold.sh

      - name: Run test suite
        run: bash tests/run-tests.sh

  consistency-check:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - name: Cross-version consistency
        run: |
          CC="skills/loopforge-cc/scaffold.sh"
          CX="skills/loopforge-codex/scaffold.sh"

          echo "=== Version consistency ==="
          cc_ver=$(grep '^LOOPFORGE_VERSION=' "$CC" | head -1)
          cx_ver=$(grep '^LOOPFORGE_VERSION=' "$CX" | head -1)
          echo "CC:  $cc_ver"
          echo "CX:  $cx_ver"
          [ "$cc_ver" = "$cx_ver" ] || { echo "FAIL: version mismatch"; exit 1; }

          echo "=== Shared block identical ==="
          cc_start=$(grep -n '^cmd_tokens' "$CC" | head -1 | cut -d: -f1)
          cx_start=$(grep -n '^cmd_tokens' "$CX" | head -1 | cut -d: -f1)
          cc_end=$(wc -l < "$CC")
          cx_end=$(wc -l < "$CX")
          sed -n "${cc_start},${cc_end}p" "$CC" > /tmp/cc_shared.txt
          sed -n "${cx_start},${cx_end}p" "$CX" > /tmp/cx_shared.txt
          diff /tmp/cc_shared.txt /tmp/cx_shared.txt && echo "Shared block: IDENTICAL" || { echo "FAIL: shared block differs"; exit 1; }

          echo "=== All consistency checks passed ==="

  # E2E smoke against REAL `openspec init` (the unit tests run --no-init).
  # Deliberately installs @latest: this job exists to catch breaking changes
  # in upstream OpenSpec behavior the day they ship, not months later (the
  # 1.6 -> 1.15 drift went unnoticed because nothing exercised real init).
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install openspec CLI (latest)
        run: npm install -g @fission-ai/openspec@latest

      - name: E2E - CC edition (scaffold with real init + strict validate + audit)
        run: |
          bash skills/loopforge-cc/scaffold.sh demoapp --dir "$RUNNER_TEMP/e2e-cc" --tools claude
          cd "$RUNNER_TEMP/e2e-cc"
          # 1.15 structure assertions
          test -f .claude/commands/opsx/verify.md          # loopforge-added verify command
          test -f openspec/config.yaml                     # 1.15 init artifact
          test -d openspec/changes/archive                 # canonical archive location
          test ! -e openspec/project.md                    # merged into README
          test ! -e openspec/archive                       # legacy layout must not return
          grep -q '^## Project Overview' openspec/README.md
          grep -q 'LoopForge: superpowers-trigger-propose' .claude/commands/opsx/propose.md
          # strict validation of generated specs + delta template
          openspec validate --all --strict
          # re-run must be idempotent (exactly one injection: open+close markers)
          bash "$GITHUB_WORKSPACE/skills/loopforge-cc/scaffold.sh" demoapp --dir . > /dev/null
          [ "$(grep -c 'LoopForge: superpowers-trigger-propose' .claude/commands/opsx/propose.md)" = "2" ]
          # compliance audit: FAILs are never acceptable (PARTIALs ok - no Superpowers on CI)
          bash "$GITHUB_WORKSPACE/skills/loopforge-cc/scaffold.sh" check . | tee check-cc.txt
          grep -q '· 0 failed' check-cc.txt

      - name: E2E - Codex edition (scaffold with real init + strict validate + audit)
        run: |
          bash skills/loopforge-codex/scaffold.sh demoapp --dir "$RUNNER_TEMP/e2e-cx" --tools codex
          cd "$RUNNER_TEMP/e2e-cx"
          # 1.15 codex layout: .agents/skills/ (not .codex/)
          test -f .agents/skills/openspec-verify/SKILL.md  # loopforge-added verify skill
          test -d .agents/skills/openspec-propose
          test ! -e .codex                                 # legacy layout must not return
          grep -q 'LoopForge: superpowers-trigger-propose' .agents/skills/openspec-propose/SKILL.md
          grep -q '^## Project Overview' openspec/README.md
          openspec validate --all --strict
          bash "$GITHUB_WORKSPACE/skills/loopforge-codex/scaffold.sh" check . | tee check-cx.txt
          grep -q '· 0 failed' check-cx.txt
